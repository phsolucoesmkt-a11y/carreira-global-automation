<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Carreira Global Automação</title>
<style>
  :root { --bg:#0b0d12; --card:#12151c; --border:#232733; --text:#e7e9ee; --muted:#8b93a3; --accent:#818cf8; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; background:#0e1117; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:16px; }
  button { width:100%; background:var(--accent); color:#0b0d12; border:none; padding:11px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; }
  .erro { color:var(--err); font-size:13px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Carreira Global</h1>
    <div class="sub">Automação — entre para continuar</div>
    <form id="login-form">
      <label>Usuário</label>
      <input type="text" id="user" autocomplete="username" required />
      <label>Senha</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit">Entrar</button>
      <div class="erro" id="erro"></div>
    </form>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('user').value;
  const password = document.getElementById('password').value;
  const erro = document.getElementById('erro');
  erro.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, password }),
    });
    const data = await res.json();
    if (!res.ok) { erro.textContent = data.error || 'Erro ao entrar.'; return; }
    window.location.href = '/';
  } catch (err) {
    erro.textContent = 'Erro de conexão.';
  }
});
</script>
</body>
</html>
