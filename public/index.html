<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carreira Global — Automação</title>
<style>
  :root {
    --bg: #08090c; --bg-elev: #0b0d12;
    --surface: #12141b; --surface-2: #171a23; --surface-hover: #1c1f2a;
    --border: #21242f; --border-soft: #191c26;
    --text: #eef0f4; --muted: #9298ab; --faint: #575e73;
    --gravado: #8b8ff8; --gravado-dim: rgba(139,143,248,0.13); --gravado-grad: linear-gradient(135deg, #9498f9, #6b6ef0);
    --aovivo: #fb5f6a; --aovivo-dim: rgba(251,95,106,0.13); --aovivo-grad: linear-gradient(135deg, #fd7078, #f0424f);
    --interno: #8890a4; --interno-dim: rgba(136,144,164,0.16); --interno-grad: linear-gradient(135deg, #9aa2b4, #6b7286);
    --ok: #3ddc97; --ok-dim: rgba(61,220,151,0.13);
    --warn: #f5c04a; --warn-dim: rgba(245,192,74,0.13);
    --err: #f2555f; --err-dim: rgba(242,85,95,0.13);
    --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background:
      radial-gradient(700px 420px at 8% -6%, rgba(139,143,248,0.06), transparent 60%),
      radial-gradient(700px 420px at 96% 8%, rgba(251,95,106,0.05), transparent 55%),
      var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  nav {
    width: 232px; flex-shrink: 0; border-right: 1px solid var(--border-soft);
    padding: 22px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    background: var(--bg-elev);
  }
  .brand-row { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 26px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--gravado), var(--aovivo)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12.5px; color: #08090c; flex-shrink: 0; }
  .brand-text { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; line-height: 1.2; }
  .brand-sub { color: var(--faint); font-size: 10.5px; letter-spacing: 0.04em; margin-top: 1px; }
  .nav-section-label { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 12px 6px; font-weight: 700; }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm);
    font-size: 13.5px; cursor: pointer; color: var(--muted); margin-bottom: 1px; font-weight: 500;
    border-left: 2px solid transparent; transition: background 0.12s, color 0.12s;
  }
  .navitem svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
  .navitem:hover { background: var(--surface-hover); color: var(--text); }
  .navitem.active { background: var(--gravado-dim); color: var(--gravado); font-weight: 600; border-left-color: var(--gravado); }
  .navitem.active svg { opacity: 1; }
  nav .spacer { flex: 1; }
  .status-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 8px; margin-bottom: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--muted); flex-shrink: 0; }
  .dot.on { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
  .dot.off { background: var(--err); box-shadow: 0 0 7px var(--err); }
  .user-row { font-size: 11.5px; color: var(--faint); padding: 0 8px 10px; }

  /* ---------- Main ---------- */
  main { flex: 1; padding: 30px 40px 60px; max-width: 1040px; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 16px; }
  .page-title { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.015em; }
  .page-sub { color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 560px; }

  /* ---------- Track identity ---------- */
  .track-dot { display: inline-block; width: 7px; height: 7px; border-radius: 999px; margin-right: 6px; vertical-align: middle; }
  .track-dot.gravado { background: var(--gravado); box-shadow: 0 0 6px var(--gravado); }
  .track-dot.ao-vivo { background: var(--aovivo); box-shadow: 0 0 6px var(--aovivo); }
  .track-dot.interno { background: var(--interno); box-shadow: 0 0 6px var(--interno); }
  .track-toggle { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-bottom: 22px; }
  .track-toggle button {
    background: transparent; border: none; color: var(--muted); font-size: 12.5px; font-weight: 600;
    padding: 7px 16px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; transition: background 0.15s, color 0.15s;
  }
  .track-toggle button.active.gravado { background: var(--gravado-dim); color: var(--gravado); }
  .track-toggle button.active.ao-vivo { background: var(--aovivo-dim); color: var(--aovivo); }
  .track-toggle button.active.interno { background: var(--interno-dim); color: var(--interno); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 10px; transition: border-color 0.15s;
  }
  .card.track-gravado { border-left: 3px solid var(--gravado); }
  .card.track-interno { border-left: 3px dashed var(--interno); }
  .card.track-ao-vivo { border-left: 3px solid var(--aovivo); }
  .card-title { font-weight: 600; font-size: 14px; letter-spacing: -0.005em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .row.top { align-items: flex-start; }
  .muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .faint { color: var(--faint); font-size: 11.5px; }

  /* ---------- Badges ---------- */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
  .badge.sucesso, .badge.ativo { background: var(--ok-dim); color: var(--ok); }
  .badge.erro { background: var(--err-dim); color: var(--err); }
  .badge.sem-dados, .badge.inativo { background: rgba(146,152,171,0.12); color: var(--muted); }
  .badge.pendente { background: var(--warn-dim); color: var(--warn); }

  /* ---------- Section headers ---------- */
  .dia-header { font-size: 11.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.07em; margin: 22px 0 8px; padding-left: 2px; }
  .dia-header:first-child { margin-top: 0; }
  .section-count { font-weight: 500; color: var(--faint); text-transform: none; letter-spacing: 0; }

  /* ---------- Toggle switch ---------- */
  .switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background 0.15s; }
  .switch .knob { position: absolute; width: 13px; height: 13px; left: 3px; top: 3px; background: #fff; border-radius: 999px; transition: transform 0.15s; }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track .knob { transform: translateX(15px); }
  .fluxo-toggle { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }

  /* ---------- Forms ---------- */
  form { display: flex; flex-direction: column; gap: 12px; }
  input, textarea, select {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gravado); box-shadow: 0 0 0 3px var(--gravado-dim); }
  label { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; display: block; font-weight: 500; }

  /* ---------- Buttons ---------- */
  button {
    background: var(--gravado-grad); color: #0a0b10; border: none; padding: 9px 15px; border-radius: var(--radius-sm);
    font-weight: 600; font-size: 12.5px; cursor: pointer; transition: filter 0.12s, transform 0.08s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button.btn-live { background: var(--aovivo-grad); color: #1a0708; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { background: var(--surface-hover); filter: none; }
  button.danger { background: transparent; border: 1px solid var(--err-dim); color: var(--err); }
  button.danger:hover { background: var(--err-dim); filter: none; }
  button.small { padding: 6px 12px; font-size: 11.5px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .empty { color: var(--faint); font-size: 12.5px; padding: 16px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--bg-elev); }
  pre { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-size: 11.5px; overflow-x: auto; white-space: pre-wrap; color: var(--muted); }

  /* ---------- Stats / dashboard ---------- */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-card.track-gravado { border-top: 2px solid var(--gravado); }
  .stat-card.track-ao-vivo { border-top: 2px solid var(--aovivo); }
  .stat-label { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; display: flex; align-items: center; }
  .stat-value { font-size: 25px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
  .stat-hint { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
  .dash-col-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dash-col-title h3 { font-size: 13.5px; margin: 0; display: flex; align-items: center; font-weight: 700; }
  .link-btn { background: none; border: none; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .link-btn:hover { color: var(--text); }
  .mini-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border-soft); margin-bottom: 6px; }
  .mini-row .mr-name { font-size: 12.5px; font-weight: 600; }
  .mini-row .mr-when { font-size: 11px; color: var(--faint); margin-top: 1px; }

  a { color: var(--gravado); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h3 { font-size: 14px; font-weight: 700; margin: 0; }

  @media (max-width: 900px) {
    .dash-cols { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div class="app">
    <nav>
      <div class="brand-row">
        <div class="brand-mark">CG</div>
        <div>
          <div class="brand-text">Carreira Global</div>
          <div class="brand-sub">AUTOMAÇÃO</div>
        </div>
      </div>
      <div class="navitem" data-view="overview"><span>Visão Geral</span></div>
      <div class="navitem" data-view="fluxos"><span>Fluxos</span></div>
      <div class="navitem" data-view="grupos"><span>Grupos</span></div>
      <div class="navitem" data-view="editar"><span>Editar</span></div>
      <div class="navitem" data-view="config"><span>Configurações</span></div>
      <div class="navitem" data-view="usuarios"><span>Usuários</span></div>
      <div class="spacer"></div>
      <div class="status-row"><span id="dot" class="dot"></span><span id="status-text">verificando…</span></div>
      <div class="user-row" id="user-row"></div>
      <button class="secondary small" id="btn-sair" style="width:100%">Sair</button>
    </nav>
    <main id="main"></main>
  </div>

<script>
const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>',
  flow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="4" width="6" height="6" rx="1.5"/><rect x="9" y="15" width="6" height="6" rx="1.5"/><path d="M6 10v2a2 2 0 0 0 2 2h1"/><path d="M18 10v2a2 2 0 0 1-2 2h-1"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
};

let state = {
  view: 'overview', fluxos: [], grupos: [], modelo: null, execucoes: [], me: null,
  linkDaLive: '', linkReplay: '', linkAoVivo: '', editando: null, editandoCampos: null, editandoCron: '',
  trilhaGrupos: 'gravado', trilhaEditar: 'gravado', trilhaFluxos: 'gravado',
  gruposAoVivo: [], modeloAoVivo: null,
};

function endpointsTrilha(trilha) {
  return trilha === 'ao-vivo'
    ? { grupos: '/api/arvore-grupos-ao-vivo', modelo: '/api/grupo-modelo-ao-vivo' }
    : { grupos: '/api/arvore-grupos', modelo: '/api/grupo-modelo' };
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) { window.location.href = '/login.html'; throw new Error('não autenticado'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function badge(status) {
  const cls = status === 'Ativo' ? 'ativo' : status === 'Pendente' ? 'pendente' : status === 'Inativo' ? 'inativo' : status === 'sucesso' ? 'sucesso' : status === 'erro' ? 'erro' : 'sem-dados';
  return `<span class="badge ${cls}">${status}</span>`;
}

function trackLabel(trilha) {
  return trilha === 'ao-vivo' ? 'Ao Vivo' : trilha === 'interno' ? 'Interno' : 'Gravado';
}

function trackDot(trilha) {
  const cls = trilha === 'ao-vivo' ? 'ao-vivo' : trilha === 'interno' ? 'interno' : 'gravado';
  return `<span class="track-dot ${cls}"></span>`;
}

function fmtData(iso) {
  return iso ? new Date(iso.replace(' ', 'T') + 'Z').toLocaleString('pt-BR') : '—';
}

async function checarStatus() {
  const dot = document.getElementById('dot');
  const text = document.getElementById('status-text');
  try {
    await api('/api/health');
    dot.className = 'dot on';
    text.textContent = 'Sistema ativo';
  } catch {
    dot.className = 'dot off';
    text.textContent = 'Sistema fora do ar';
  }
}

async function carregarTudo() {
  const [fluxosRes, gruposRes, modeloRes, meRes, linkRes, replayRes, linkAoVivoRes, gruposAoVivoRes, modeloAoVivoRes] = await Promise.all([
    api('/api/fluxos'),
    api('/api/arvore-grupos'),
    api('/api/grupo-modelo'),
    api('/api/me'),
    api('/api/config/link-da-live'),
    api('/api/config/link-replay'),
    api('/api/config/link-ao-vivo'),
    api('/api/arvore-grupos-ao-vivo'),
    api('/api/grupo-modelo-ao-vivo'),
  ]);
  state.fluxos = fluxosRes.fluxos;
  state.grupos = gruposRes.grupos;
  state.modelo = modeloRes.modelo;
  state.me = meRes.user;
  state.linkDaLive = linkRes.link;
  state.linkReplay = replayRes.link;
  state.linkAoVivo = linkAoVivoRes.link;
  state.gruposAoVivo = gruposAoVivoRes.grupos;
  state.modeloAoVivo = modeloAoVivoRes.modelo;
}

function renderMiniRow(f) {
  return `
    <div class="mini-row">
      <div>
        <div class="mr-name">${f.nome}</div>
        <div class="mr-when">${f.quando}</div>
      </div>
      <div>${f.ultimaExecucao ? badge(f.ultimaExecucao.status) : badge('sem-dados')}</div>
    </div>
  `;
}

function renderOverview() {
  const gruposAtivosGravado = state.grupos.filter(g => g.status === 'Ativo').length;
  const gruposAtivosAoVivo = state.gruposAoVivo.filter(g => g.status === 'Ativo').length;
  const ultimasExecucoes = state.fluxos.filter(f => f.ultimaExecucao).length;
  const fluxosGravado = state.fluxos.filter(f => (f.trilha || 'gravado') === 'gravado');
  const fluxosAoVivo = state.fluxos.filter(f => f.trilha === 'ao-vivo');
  return `
    <div class="page-header">
      <div><h1 class="page-title">Visão Geral</h1><div class="page-sub">Resumo das duas trilhas de automação — Gravado e Ao Vivo rodando em paralelo</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Fluxos configurados</div><div class="stat-value">${state.fluxos.length}</div><div class="stat-hint">${fluxosGravado.length} Gravado · ${fluxosAoVivo.length} Ao Vivo</div></div>
      <div class="stat-card track-gravado"><div class="stat-label">${trackDot('gravado')}Grupos ativos</div><div class="stat-value">${gruposAtivosGravado}</div><div class="stat-hint">Trilha Gravado</div></div>
      <div class="stat-card track-ao-vivo"><div class="stat-label">${trackDot('ao-vivo')}Grupos ativos</div><div class="stat-value">${gruposAtivosAoVivo}</div><div class="stat-hint">Trilha Ao Vivo</div></div>
      <div class="stat-card"><div class="stat-label">Já executados</div><div class="stat-value">${ultimasExecucoes}</div><div class="stat-hint">de ${state.fluxos.length} fluxos</div></div>
    </div>
    <div class="dash-cols">
      <div>
        <div class="dash-col-title"><h3>${trackDot('gravado')}Gravado — próximos</h3><button class="link-btn" data-goto-fluxos="gravado">ver todos →</button></div>
        ${fluxosGravado.slice(0, 6).map(renderMiniRow).join('') || '<div class="empty">Nenhum fluxo.</div>'}
      </div>
      <div>
        <div class="dash-col-title"><h3>${trackDot('ao-vivo')}Ao Vivo — próximos</h3><button class="link-btn" data-goto-fluxos="ao-vivo">ver todos →</button></div>
        ${fluxosAoVivo.slice(0, 6).map(renderMiniRow).join('') || '<div class="empty">Nenhum fluxo.</div>'}
      </div>
    </div>
  `;
}

function campoLabel(chave) {
  const nomes = {
    videoUrl: 'URL do vídeo', texto: 'Texto da mensagem', mensagem: 'Texto da mensagem',
    pergunta: 'Pergunta', avisoTexto: 'Texto do aviso', prefixoNome: 'Novo nome do grupo (prefixo)',
    enquetePergunta: 'Pergunta da enquete', enqueteOpcoes: 'Opções da enquete (uma por linha)',
    mensagemLink: 'Mensagem com o link', mensagemCobranca: 'Mensagem de cobrança (5min depois)',
  };
  return nomes[chave] || chave;
}

function renderCampoInput(chave, valor) {
  const label = campoLabel(chave);
  if (Array.isArray(valor)) {
    return `<div><label>${label}</label><textarea rows="4" data-campo="${chave}" data-tipo="lista">${valor.join('\n')}</textarea></div>`;
  }
  if (typeof valor === 'string' && (valor.length > 60 || valor.includes('\n'))) {
    return `<div><label>${label}</label><textarea rows="5" data-campo="${chave}">${valor}</textarea></div>`;
  }
  return `<div><label>${label}</label><input type="text" data-campo="${chave}" value="${(valor ?? '').toString().replace(/"/g, '&quot;')}" /></div>`;
}

function renderEdicaoFluxo(f) {
  if (state.editando !== f.chave) return '';
  const campos = state.editandoCampos || {};
  return `
    <div class="card" style="margin-top:10px;border-color:${f.trilha === 'ao-vivo' ? 'var(--aovivo)' : f.trilha === 'interno' ? 'var(--interno)' : 'var(--gravado)'}">
      <form id="form-editar-fluxo" data-chave="${f.chave}">
        ${Object.entries(campos).map(([k, v]) => renderCampoInput(k, v)).join('')}
        <div>
          <label>Horário (cron: minuto hora * * dia-da-semana, 0=domingo…6=sábado)</label>
          <input type="text" id="f-cron" value="${state.editandoCron}" placeholder="0 20 * * 2" />
        </div>
        <div class="muted">Use {{link}} pro link da live, ou {{replay}} pro link do replay — ambos configuráveis na aba Configurações.</div>
        <div class="actions">
          <button type="submit">Salvar</button>
          <button type="button" class="secondary" id="btn-cancelar-edicao-fluxo">Cancelar</button>
        </div>
      </form>
    </div>
  `;
}

function renderCardFluxo(f) {
  const isLive = f.trilha === 'ao-vivo';
  const trackClass = f.trilha === 'interno' ? 'interno' : isLive ? 'ao-vivo' : 'gravado';
  return `
    <div class="card track-${trackClass}">
      <div class="row top">
        <div>
          <div class="card-title">${f.nome}</div>
          <div class="muted" style="margin-top:2px">Automático: ${f.quando}</div>
          ${f.ultimaExecucao ? `<div class="muted" style="margin-top:4px">Última execução (${f.ultimaExecucao.origem}): ${fmtData(f.ultimaExecucao.executado_em)} ${badge(f.ultimaExecucao.status)}</div>` : '<div class="faint" style="margin-top:4px">Nunca executado</div>'}
          <label class="fluxo-toggle">
            <span class="switch"><input type="checkbox" data-toggle-ativo="${f.chave}" ${f.ativo ? 'checked' : ''}><span class="track"><span class="knob"></span></span></span>
            ${f.ativo ? 'Automático ligado' : 'Automático pausado (executar manualmente continua funcionando)'}
          </label>
        </div>
        <div class="actions">
          ${f.editavel ? `<button class="small secondary" data-editar="${f.chave}">Editar</button>` : ''}
          <button class="small ${isLive ? 'btn-live' : ''}" data-executar="${f.chave}">Executar agora</button>
        </div>
      </div>
      <div id="resultado-${f.chave}" style="margin-top:10px"></div>
      ${renderEdicaoFluxo(f)}
    </div>
  `;
}

function renderTrackToggle(stateKey, { comInterno = false } = {}) {
  const atual = state[stateKey];
  return `
    <div class="track-toggle">
      <button type="button" class="${atual === 'gravado' ? 'active gravado' : ''}" data-set-trilha="${stateKey}" data-trilha-valor="gravado">${trackDot('gravado')}Gravado</button>
      <button type="button" class="${atual === 'ao-vivo' ? 'active ao-vivo' : ''}" data-set-trilha="${stateKey}" data-trilha-valor="ao-vivo">${trackDot('ao-vivo')}Ao Vivo</button>
      ${comInterno ? `<button type="button" class="${atual === 'interno' ? 'active interno' : ''}" data-set-trilha="${stateKey}" data-trilha-valor="interno">${trackDot('interno')}Interno</button>` : ''}
    </div>
  `;
}

function renderFluxos() {
  const trilha = state.trilhaFluxos;
  const lista = state.fluxos.filter(f => (f.trilha || 'gravado') === trilha);
  let ultimoDia = null;
  const blocos = lista.map(f => {
    const header = f.dia !== ultimoDia ? `<div class="dia-header">${f.dia}</div>` : '';
    ultimoDia = f.dia;
    return header + renderCardFluxo(f);
  }).join('');
  return `
    <div class="page-header">
      <div><h1 class="page-title">Fluxos</h1><div class="page-sub">Fluxos automatizados da trilha selecionada, na ordem em que rodam durante a semana</div></div>
    </div>
    ${renderTrackToggle('trilhaFluxos', { comInterno: true })}
    ${blocos || '<div class="empty">Nenhum fluxo nessa trilha.</div>'}
  `;
}

function renderConfig() {
  return `
    <div class="page-header">
      <div><h1 class="page-title">Configurações</h1><div class="page-sub">Valores compartilhados entre fluxos</div></div>
    </div>
    <div class="card track-gravado">
      <form id="form-link-live">

function renderCardGrupo(g, trilha) {
  const isLive = trilha === 'ao-vivo';
  return `
    <div class="card track-${isLive ? 'ao-vivo' : 'gravado'}">
      <div class="row top">
        <div>
          <div class="card-title">${g.nome || g.id}</div>
          <div class="faint" style="margin-top:2px">ID: ${g.id}</div>
          ${g.link ? `<div class="muted" style="margin-top:2px"><a href="${g.link}" target="_blank">${g.link}</a></div>` : '<div class="faint" style="margin-top:2px">Sem link registrado</div>'}
          <div class="muted" style="margin-top:6px">Criado em ${fmtData(g.criado_em)}</div>
          <div class="muted">
            ${g.participantes != null ? `${g.participantes} participante${g.participantes === 1 ? '' : 's'}` : 'Participantes ainda não conferidos'}
            ${g.participantes_atualizado_em ? ` · atualizado em ${fmtData(g.participantes_atualizado_em)}` : ''}
          </div>
          ${isLive && g.link_override ? `<div class="muted" style="margin-top:6px;color:var(--aovivo)">Link exclusivo neste grupo: ${g.link_override}</div>` : ''}
        </div>
        <div style="text-align:right">
          ${badge(g.status)}
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end">

            ${g.status !== 'Ativo' ? `<button class="small secondary" data-mudar-status="${g.id}" data-novo-status="Ativo" data-trilha="${trilha}">Marcar Ativo</button>` : ''}
            ${g.status !== 'Pendente' ? `<button class="small secondary" data-mudar-status="${g.id}" data-novo-status="Pendente" data-trilha="${trilha}">Marcar Pendente</button>` : ''}
            ${g.status !== 'Inativo' ? `<button class="small danger" data-mudar-status="${g.id}" data-novo-status="Inativo" data-trilha="${trilha}">Marcar Inativo</button>` : ''}
            ${isLive && g.link_override ? `<button class="small secondary" data-limpar-link-override="${g.id}">Remover link exclusivo</button>` : ''}
          </div>
        </div>
      </div>
      ${isLive ? `
      <details class="link-override-details" style="margin-top:12px">
        <summary class="small secondary" style="cursor:pointer;display:inline-block">${g.link_override ? 'Trocar link exclusivo' : 'Usar link diferente'}</summary>
        <form data-form-link-override="${g.id}" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <input type="text" name="link" placeholder="https://..." value="${g.link_override || ''}" style="flex:1;min-width:220px" />
          <button type="submit" class="small btn-live">Salvar</button>

      </details>
      ` : ''}

  return `
    <div class="card">
      <div class="card-title" style="margin-bottom:8px">Cadastrar grupo manualmente</div>
      <div class="muted" style="margin-bottom:12px">Use isto quando um grupo foi criado direto no WhatsApp (fora do fluxo "Criar o Grupo") e precisa entrar no sistema pra receber os disparos.</div>
      <form id="form-add-grupo" data-trilha="${trilha}">
        <div>
          <label>ID do grupo (ex: 120363xxxxxxxxxxxx@g.us)</label>
          <input type="text" id="ag-id" required />
        </div>
        <div>
          <label>Nome (opcional)</label>
          <input type="text" id="ag-nome" />

        <div>
          <label>Link de convite (opcional)</label>
          <input type="text" id="ag-link" />

function renderGrupos() {
  const trilha = state.trilhaGrupos;
  const lista = trilha === 'ao-vivo' ? state.gruposAoVivo : state.grupos;
  const ativos = lista.filter(g => g.status === 'Ativo');
  const pendentes = lista.filter(g => g.status === 'Pendente');
  const inativos = lista.filter(g => g.status === 'Inativo');
  return `
    <div class="page-header">
      <div><h1 class="page-title">Grupos</h1><div class="page-sub">Grupos criados por este sistema — ativos, pendentes e histórico</div></div>
    </div>
    ${renderTrackToggle('trilhaGrupos')}
    ${renderFormAdicionarGrupo(trilha)}
    ${lista.length === 0 ? '<div class="empty">Nenhum grupo criado ainda.</div>' : `
      <div class="dia-header">Ativos <span class="section-count">(${ativos.length})</span></div>
      ${ativos.length === 0 ? '<div class="empty">Nenhum grupo ativo no momento.</div>' : ativos.map(g => renderCardGrupo(g, trilha)).join('')}
      <div class="dia-header">Pendentes <span class="section-count">(${pendentes.length})</span></div>
      ${pendentes.length === 0 ? '<div class="empty">Nenhum grupo pendente.</div>' : `
        <div class="muted" style="margin-bottom:8px">Já criados de verdade (link pronto pra usar), mas ainda fora dos disparos automáticos — ativam sozinhos quando o grupo Ativo atual for encerrado.</div>
        ${pendentes.map(g => renderCardGrupo(g, trilha)).join('')}
      `}
      <div class="dia-header">Inativos / encerrados <span class="section-count">(${inativos.length})</span></div>
      ${inativos.length === 0 ? '<div class="empty">Nenhum grupo inativo ainda.</div>' : inativos.map(g => renderCardGrupo(g, trilha)).join('')}
    `}
  `;
}

function renderEditar() {
  const trilha = state.trilhaEditar;
  const m = trilha === 'ao-vivo' ? state.modeloAoVivo : state.modelo;
  const isLive = trilha === 'ao-vivo';
  return `
    <div class="page-header">
      <div><h1 class="page-title">Editar molde do grupo</h1><div class="page-sub">Nome, imagem, descrição e áudio reaproveitados toda semana pelo fluxo "Criar o Grupo"</div></div>
    </div>
    ${renderTrackToggle('trilhaEditar')}
    <div class="card track-${isLive ? 'ao-vivo' : 'gravado'}">
      <form id="form-modelo" data-trilha="${trilha}">
        <div>
          <label>Nome do grupo</label>
          <input type="text" id="f-nome" required value="${m?.nome ?? ''}" />
        </div>
        <div>
          <label>Descrição</label>
          <textarea id="f-descricao" rows="3">${m?.descricao ?? ''}</textarea>
        </div>
        <div>
          <label>URL da imagem (Google Drive)</label>
          <input type="text" id="f-imagem" value="${m?.imagem_url ?? ''}" />
        </div>
        <div>
          <label>Áudio Nina (Google Drive)</label>
          <input type="text" id="f-audio" value="${m?.audio_url ?? ''}" />
        </div>
        <div><button type="submit" class="${isLive ? 'btn-live' : ''}">Salvar</button></div>
      </form>
      <div class="muted" style="margin-top:12px">
        ${m?.ultimo_group_id ? `Último grupo criado: ${m.ultimo_group_id}${m.ultimo_invite_url ? ` · <a href="${m.ultimo_invite_url}" target="_blank">${m.ultimo_invite_url}</a>` : ''}` : 'Nenhum grupo criado a partir deste molde ainda.'}
      </div>
      <div id="salvo-msg" class="muted" style="margin-top:8px"></div>
    </div>

function renderUsuarios() {
  return `
    <div class="page-header">
      <div><h1 class="page-title">Usuários</h1><div class="page-sub">Acesso ao sistema</div></div>
    </div>
    <div class="card">
      <div class="muted">Usuário logado</div>
      <div class="card-title" style="margin-top:4px">${state.me || '—'}</div>
    </div>
    <div class="card">
      <div class="muted">Este sistema hoje tem um único usuário administrador (login/senha configurados no servidor). Pra trocar a senha ou adicionar outro usuário, é preciso mexer nas variáveis de ambiente do servidor.</div>
    </div>
  `;
}

function render() {
  document.querySelectorAll('.navitem').forEach(el => el.classList.toggle('active', el.dataset.view === state.view));
  const main = document.getElementById('main');
  if (state.view === 'overview') main.innerHTML = renderOverview();
  else if (state.view === 'fluxos') main.innerHTML = renderFluxos();
  else if (state.view === 'grupos') main.innerHTML = renderGrupos();
  else if (state.view === 'editar') main.innerHTML = renderEditar();
  else if (state.view === 'config') main.innerHTML = renderConfig();
  else if (state.view === 'usuarios') main.innerHTML = renderUsuarios();
  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll('[data-set-trilha]').forEach(btn => {
    btn.addEventListener('click', () => {
      state[btn.dataset.setTrilha] = btn.dataset.trilhaValor;
      render();
    });
  });

  document.querySelectorAll('[data-goto-fluxos]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = 'fluxos';
      state.trilhaFluxos = btn.dataset.gotoFluxos;
      render();
    });
  });

  document.querySelectorAll('[data-executar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const chave = btn.dataset.executar;
      if (!confirm(`Isso vai executar "${chave}" de verdade agora. Confirma?`)) return;
      btn.disabled = true;
      const resultadoEl = document.getElementById(`resultado-${chave}`);
      resultadoEl.innerHTML = '<div class="muted">Executando…</div>';
      try {
        const r = await api(`/api/fluxos/${chave}/executar`, { method: 'POST' });
        resultadoEl.innerHTML = `<div style="color:var(--ok);font-weight:600;margin-bottom:6px">Executado com sucesso ✓</div><pre>${JSON.stringify(r, null, 2)}</pre>`;
        await carregarTudo();
      } catch (e) {
        resultadoEl.innerHTML = `<div style="color:var(--err);font-weight:600">Erro: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-toggle-ativo]').forEach(input => {
    input.addEventListener('change', async () => {
      const chave = input.dataset.toggleAtivo;
      const ativo = input.checked;
      input.disabled = true;
      try {
        await api(`/api/fluxos/${chave}/ativo`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ativo }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro ao atualizar: ${e.message}`);
        input.checked = !ativo;
        input.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-atualizar-participantes]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.atualizarParticipantes;
      const { grupos } = endpointsTrilha(btn.dataset.trilha);
      btn.disabled = true;
      btn.textContent = 'Consultando…';
      try {
        await api(`${grupos}/${encodeURIComponent(id)}/atualizar-participantes`, { method: 'POST' });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro ao atualizar participantes: ${e.message}`);
        btn.disabled = false;
        btn.textContent = 'Atualizar participantes';
      }
    });
  });

  document.querySelectorAll('[data-mudar-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.mudarStatus;
      const status = btn.dataset.novoStatus;
      const { grupos } = endpointsTrilha(btn.dataset.trilha);
      if (!confirm(`Marcar este grupo como "${status}"?`)) return;
      btn.disabled = true;
      try {
        await api(`${grupos}/${encodeURIComponent(id)}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro: ${e.message}`);
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-form-link-override]').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = form.dataset.formLinkOverride;
      const link = form.elements.link.value.trim();
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await api(`/api/arvore-grupos-ao-vivo/${encodeURIComponent(id)}/link-override`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ link: link || null }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro: ${e.message}`);
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-limpar-link-override]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.limparLinkOverride;
      btn.disabled = true;
      try {
        await api(`/api/arvore-grupos-ao-vivo/${encodeURIComponent(id)}/link-override`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ link: null }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro: ${e.message}`);
        btn.disabled = false;
      }
    });
  });

  const formAddGrupo = document.getElementById('form-add-grupo');
  if (formAddGrupo) {
    formAddGrupo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { grupos } = endpointsTrilha(formAddGrupo.dataset.trilha);
      const groupId = document.getElementById('ag-id').value.trim();
      const nome = document.getElementById('ag-nome').value.trim();
      const link = document.getElementById('ag-link').value.trim();
      const status = document.getElementById('ag-status').value;
      try {
        await api(grupos, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groupId, nome, link, status }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        document.getElementById('add-grupo-msg').textContent = `Erro: ${e.message}`;
      }
    });
  }

  const formModelo = document.getElementById('form-modelo');
  if (formModelo) {
    formModelo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { modelo } = endpointsTrilha(formModelo.dataset.trilha);
      const nome = document.getElementById('f-nome').value.trim();
      const descricao = document.getElementById('f-descricao').value.trim();
      const imagemUrl = document.getElementById('f-imagem').value.trim();
      const audioEl = document.getElementById('f-audio');
      const body = { nome, descricao, imagemUrl };
      if (audioEl) body.audioUrl = audioEl.value.trim();
      await api(modelo, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      await carregarTudo();
      document.getElementById('salvo-msg').textContent = 'Salvo ✓';
    });
  }

  document.querySelectorAll('[data-editar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const chave = btn.dataset.editar;
      const { campos, cron } = await api(`/api/fluxos/${chave}/editar`);
      state.editando = chave;
      state.editandoCampos = campos;
      state.editandoCron = cron;
      render();
    });
  });

  const btnCancelarEdicaoFluxo = document.getElementById('btn-cancelar-edicao-fluxo');
  if (btnCancelarEdicaoFluxo) {
    btnCancelarEdicaoFluxo.addEventListener('click', () => {
      state.editando = null;
      render();
    });
  }

  const formEditarFluxo = document.getElementById('form-editar-fluxo');
  if (formEditarFluxo) {
    formEditarFluxo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const chave = formEditarFluxo.dataset.chave;
      const campos = {};
      formEditarFluxo.querySelectorAll('[data-campo]').forEach(el => {
        campos[el.dataset.campo] = el.dataset.tipo === 'lista'
          ? el.value.split('\n').map(s => s.trim()).filter(Boolean)
          : el.value;
      });
      const cron = document.getElementById('f-cron').value.trim();
      await api(`/api/fluxos/${chave}/editar`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ campos, cron }),
      });
      state.editando = null;
      await carregarTudo();
      render();
    });
  }

  const formLinkLive = document.getElementById('form-link-live');
  if (formLinkLive) {
    formLinkLive.addEventListener('submit', async (e) => {
      e.preventDefault();
      const link = document.getElementById('f-link-live').value.trim();
      await api('/api/config/link-da-live', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
      });
      state.linkDaLive = link;
      document.getElementById('link-salvo-msg').textContent = 'Salvo ✓';
    });
  }

  const formLinkReplay = document.getElementById('form-link-replay');
  if (formLinkReplay) {
    formLinkReplay.addEventListener('submit', async (e) => {
      e.preventDefault();
      const link = document.getElementById('f-link-replay').value.trim();
      await api('/api/config/link-replay', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
      });
      state.linkReplay = link;
      document.getElementById('replay-salvo-msg').textContent = 'Salvo ✓';
    });
  }

  const formLinkAoVivo = document.getElementById('form-link-ao-vivo');
  if (formLinkAoVivo) {
    formLinkAoVivo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const link = document.getElementById('f-link-ao-vivo').value.trim();
      await api('/api/config/link-ao-vivo', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
      });
      state.linkAoVivo = link;
      document.getElementById('link-ao-vivo-salvo-msg').textContent = 'Salvo ✓';
    });
  }
}

document.querySelectorAll('.navitem').forEach(el => {
  el.addEventListener('click', () => { state.view = el.dataset.view; render(); });
});

document.getElementById('btn-sair').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

function montarIconesNav() {
  const map = { overview: 'home', fluxos: 'flow', grupos: 'users', editar: 'edit', config: 'link', usuarios: 'gear' };
  document.querySelectorAll('.navitem').forEach(el => {
    const iconKey = map[el.dataset.view];
    if (iconKey) el.insertAdjacentHTML('afterbegin', ICONS[iconKey]);
  });
}

(async function init() {
  montarIconesNav();
  try {
    await carregarTudo();
    document.getElementById('user-row').textContent = state.me ? `👤 ${state.me}` : '';
  } catch (e) {
    // se não autenticado, api() já redireciona
  }
  render();
  checarStatus();
  setInterval(checarStatus, 15000);
})();
</script>
</body>
</html>
