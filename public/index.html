<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carreira Global — Automação</title>
<style>
  :root {
    --bg: #0b0d12; --card: #12151c; --border: #232733; --text: #e7e9ee; --muted: #8b93a3;
    --accent: #818cf8; --accent-dim: rgba(129,140,248,0.15); --ok: #34d399; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app { display: flex; min-height: 100vh; }
  nav { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; }
  nav .brand { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  nav .brand-sub { color: var(--muted); font-size: 11.5px; margin-bottom: 22px; }
  .navitem { padding: 9px 12px; border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--muted); margin-bottom: 2px; }
  .navitem:hover { background: rgba(255,255,255,0.04); }
  .navitem.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
  main { flex: 1; padding: 28px 32px; max-width: 900px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .page-title { font-size: 21px; margin: 0 0 3px; }
  .page-sub { color: var(--muted); font-size: 13px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.sucesso, .badge.ativo { background: rgba(52,211,153,0.15); color: var(--ok); }
  .badge.erro { background: rgba(248,113,113,0.15); color: var(--err); }
  .badge.sem-dados, .badge.inativo { background: rgba(139,147,163,0.15); color: var(--muted); }
  .badge.pendente { background: rgba(250,204,21,0.15); color: #facc15; }
  .dia-header { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 8px; }
  .dia-header:first-child { margin-top: 0; }
  .trilha-header { font-size: 15px; font-weight: 800; margin: 30px 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .trilha-header:first-child { margin-top: 0; }
  .trilha-header.ao-vivo { color: #f87171; }
  .trilha-toggle { display: flex; gap: 6px; margin-bottom: 18px; }
  .trilha-toggle button { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .trilha-toggle button.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background 0.15s; }
  .switch .knob { position: absolute; width: 15px; height: 15px; left: 3px; top: 3px; background: #fff; border-radius: 999px; transition: transform 0.15s; }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track .knob { transform: translateX(17px); }
  .fluxo-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 10px; }
  input, textarea { background: #0e1117; border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 8px; font-size: 13px; font-family: inherit; width: 100%; }
  label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  button { background: var(--accent); color: #0b0d12; border: none; padding: 9px 15px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.small { padding: 6px 12px; font-size: 12.5px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  pre { background: #0e1117; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="app">
    <nav>
      <div class="brand">Carreira Global</div>
      <div class="brand-sub">Automação</div>
      <div class="navitem" data-view="overview">◆ Visão Geral</div>
      <div class="navitem" data-view="fluxos">▤ Fluxos</div>
      <div class="navitem" data-view="grupos">◎ Grupos</div>
      <div class="navitem" data-view="editar">✎ Editar</div>
      <div class="navitem" data-view="config">🔗 Configurações</div>
      <div class="navitem" data-view="usuarios">⚙ Usuários</div>
      <div style="flex:1"></div>
      <div class="status" style="margin-bottom:12px"><span id="dot" class="dot"></span><span id="status-text">verificando…</span></div>
      <button class="secondary small" id="btn-sair">Sair</button>
    </nav>
    <main id="main"></main>
  </div>

<script>
let state = {
  view: 'overview', fluxos: [], grupos: [], modelo: null, execucoes: [], me: null,
  linkDaLive: '', linkReplay: '', linkAoVivo: '', editando: null, editandoCampos: null, editandoCron: '',
  trilhaGrupos: 'gravado', trilhaEditar: 'gravado',
  gruposAoVivo: [], modeloAoVivo: null,
};

function endpointsTrilha(trilha) {
  return trilha === 'ao-vivo'
    ? { grupos: '/api/arvore-grupos-ao-vivo', modelo: '/api/grupo-modelo-ao-vivo' }
    : { grupos: '/api/arvore-grupos', modelo: '/api/grupo-modelo' };
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) { window.location.href = '/login.html'; throw new Error('não autenticado'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function badge(status) {
  const cls = status === 'Ativo' ? 'ativo' : status === 'Pendente' ? 'pendente' : status === 'Inativo' ? 'inativo' : status === 'sucesso' ? 'sucesso' : status === 'erro' ? 'erro' : 'sem-dados';
  return `<span class="badge ${cls}">${status}</span>`;
}

function fmtData(iso) {
  return iso ? new Date(iso.replace(' ', 'T') + 'Z').toLocaleString('pt-BR') : '—';
}

async function checarStatus() {
  const dot = document.getElementById('dot');
  const text = document.getElementById('status-text');
  try {
    await api('/api/health');
    dot.className = 'dot on';
    text.textContent = 'Sistema ativo';
  } catch {
    dot.className = 'dot off';
    text.textContent = 'Sistema fora do ar';
  }
}

async function carregarTudo() {
  const [fluxosRes, gruposRes, modeloRes, meRes, linkRes, replayRes, linkAoVivoRes, gruposAoVivoRes, modeloAoVivoRes] = await Promise.all([
    api('/api/fluxos'),
    api('/api/arvore-grupos'),
    api('/api/grupo-modelo'),
    api('/api/me'),
    api('/api/config/link-da-live'),
    api('/api/config/link-replay'),
    api('/api/config/link-ao-vivo'),
    api('/api/arvore-grupos-ao-vivo'),
    api('/api/grupo-modelo-ao-vivo'),
  ]);
  state.fluxos = fluxosRes.fluxos;
  state.grupos = gruposRes.grupos;
  state.modelo = modeloRes.modelo;
  state.me = meRes.user;
  state.linkDaLive = linkRes.link;
  state.linkReplay = replayRes.link;
  state.linkAoVivo = linkAoVivoRes.link;
  state.gruposAoVivo = gruposAoVivoRes.grupos;
  state.modeloAoVivo = modeloAoVivoRes.modelo;
}

function renderOverview() {
  const gruposAtivosGravado = state.grupos.filter(g => g.status === 'Ativo').length;
  const gruposAtivosAoVivo = state.gruposAoVivo.filter(g => g.status === 'Ativo').length;
  const ultimasExecucoes = state.fluxos.filter(f => f.ultimaExecucao).length;
  return `
    <div class="page-header">
      <div><h1 class="page-title">Visão Geral</h1><div class="page-sub">Resumo do sistema de automação</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Fluxos configurados</div><div class="stat-value">${state.fluxos.length}</div></div>
      <div class="stat-card"><div class="stat-label">⚪ Grupos ativos (Gravado)</div><div class="stat-value">${gruposAtivosGravado}</div></div>
      <div class="stat-card"><div class="stat-label">🔴 Grupos ativos (Ao Vivo)</div><div class="stat-value">${gruposAtivosAoVivo}</div></div>
    </div>
    <div class="stats-grid" style="grid-template-columns:1fr">
      <div class="stat-card"><div class="stat-label">Fluxos já executados</div><div class="stat-value">${ultimasExecucoes}</div></div>
    </div>
    <h3 style="margin:0 0 12px">Próximas execuções automáticas</h3>
    ${state.fluxos.map(f => `
      <div class="card row">
        <div>
          <div style="font-weight:600">${f.nome}</div>
          <div class="muted">${f.quando}</div>
        </div>
        <div>${f.ultimaExecucao ? badge(f.ultimaExecucao.status) : badge('sem-dados')}</div>
      </div>
    `).join('')}
  `;
}

function campoLabel(chave) {
  const nomes = {
    videoUrl: 'URL do vídeo', texto: 'Texto da mensagem', mensagem: 'Texto da mensagem',
    pergunta: 'Pergunta', avisoTexto: 'Texto do aviso', prefixoNome: 'Novo nome do grupo (prefixo)',
    enquetePergunta: 'Pergunta da enquete', enqueteOpcoes: 'Opções da enquete (uma por linha)',
  };
  return nomes[chave] || chave;
}

function renderCampoInput(chave, valor) {
  const label = campoLabel(chave);
  if (Array.isArray(valor)) {
    return `<div><label>${label}</label><textarea rows="4" data-campo="${chave}" data-tipo="lista">${valor.join('\n')}</textarea></div>`;
  }
  if (typeof valor === 'string' && (valor.length > 60 || valor.includes('\n'))) {
    return `<div><label>${label}</label><textarea rows="5" data-campo="${chave}">${valor}</textarea></div>`;
  }
  return `<div><label>${label}</label><input type="text" data-campo="${chave}" value="${(valor ?? '').toString().replace(/"/g, '&quot;')}" /></div>`;
}

function renderEdicaoFluxo(f) {
  if (state.editando !== f.chave) return '';
  const campos = state.editandoCampos || {};
  return `
    <div class="card" style="margin-top:10px;border-color:var(--accent)">
      <form id="form-editar-fluxo" data-chave="${f.chave}">
        ${Object.entries(campos).map(([k, v]) => renderCampoInput(k, v)).join('')}
        <div>
          <label>Horário (cron: minuto hora * * dia-da-semana, 0=domingo…6=sábado)</label>
          <input type="text" id="f-cron" value="${state.editandoCron}" placeholder="0 20 * * 2" />
        </div>
        <div class="muted">Use {{link}} pro link da live, ou {{replay}} pro link do replay — ambos configuráveis na aba Configurações.</div>
        <div class="actions">
          <button type="submit">Salvar</button>
          <button type="button" class="secondary" id="btn-cancelar-edicao-fluxo">Cancelar</button>
        </div>
      </form>
    </div>
  `;
}

function renderFluxos() {
  let ultimoDia = null;
  let ultimaTrilha = null;
  const blocos = state.fluxos.map(f => {
    const trilhaHeader = f.trilha !== ultimaTrilha
      ? `<div class="trilha-header ${f.trilha}">${f.trilha === 'ao-vivo' ? '🔴 Ao Vivo' : '⚪ Gravado'}</div>`
      : '';
    if (f.trilha !== ultimaTrilha) ultimoDia = null;
    ultimaTrilha = f.trilha;
    const header = trilhaHeader + (f.dia !== ultimoDia ? `<div class="dia-header">${f.dia}</div>` : '');
    ultimoDia = f.dia;
    return `
      ${header}
      <div class="card">
        <div class="row">
          <div>
            <div style="font-weight:600">${f.nome}</div>
            <div class="muted">Automático: ${f.quando}</div>
            ${f.ultimaExecucao ? `<div class="muted" style="margin-top:4px">Última execução (${f.ultimaExecucao.origem}): ${fmtData(f.ultimaExecucao.executado_em)} ${badge(f.ultimaExecucao.status)}</div>` : '<div class="muted" style="margin-top:4px">Nunca executado</div>'}
            <label class="fluxo-toggle" style="margin-top:8px">
              <span class="switch"><input type="checkbox" data-toggle-ativo="${f.chave}" ${f.ativo ? 'checked' : ''}><span class="track"><span class="knob"></span></span></span>
              ${f.ativo ? 'Automático ligado' : 'Automático pausado (executar manualmente continua funcionando)'}
            </label>
          </div>
          <div class="actions">
            ${f.editavel ? `<button class="small secondary" data-editar="${f.chave}">Editar</button>` : ''}
            <button class="small" data-executar="${f.chave}">Executar agora</button>
          </div>
        </div>
        <div id="resultado-${f.chave}" style="margin-top:10px"></div>
        ${renderEdicaoFluxo(f)}
      </div>
    `;
  }).join('');
  return `
    <div class="page-header">
      <div><h1 class="page-title">Fluxos</h1><div class="page-sub">Todos os fluxos automatizados, na ordem em que rodam durante a semana</div></div>
    </div>
    ${blocos}
  `;
}

function renderConfig() {
  return `
    <div class="page-header">
      <div><h1 class="page-title">Configurações</h1><div class="page-sub">Valores compartilhados entre fluxos</div></div>
    </div>
    <div class="card">
      <form id="form-link-live">
        <label>Link da live (usado nas mensagens de contagem regressiva de quinta-feira)</label>
        <input type="text" id="f-link-live" value="${state.linkDaLive}" />
        <div><button type="submit">Salvar</button></div>
      </form>
      <div id="link-salvo-msg" class="muted" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <form id="form-link-replay">
        <label>Link do replay (usado nas mensagens de sexta-feira, pós-workshop)</label>
        <input type="text" id="f-link-replay" value="${state.linkReplay}" />
        <div><button type="submit">Salvar</button></div>
      </form>
      <div id="replay-salvo-msg" class="muted" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <form id="form-link-ao-vivo">
        <label>🔴 Link do Ao Vivo (YouTube — usado nas mensagens de contagem regressiva e durante a live da trilha Ao Vivo)</label>
        <input type="text" id="f-link-ao-vivo" value="${state.linkAoVivo}" />
        <div><button type="submit">Salvar</button></div>
      </form>
      <div id="link-ao-vivo-salvo-msg" class="muted" style="margin-top:8px"></div>
    </div>
  `;
}

function renderCardGrupo(g, trilha) {
  return `
    <div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600">${g.nome || g.id}</div>
          <div class="muted">ID: ${g.id}</div>
          ${g.link ? `<div class="muted"><a href="${g.link}" target="_blank">${g.link}</a></div>` : '<div class="muted">Sem link registrado</div>'}
          <div class="muted">Criado em ${fmtData(g.criado_em)}</div>
          <div class="muted">
            ${g.participantes != null ? `${g.participantes} participante${g.participantes === 1 ? '' : 's'}` : 'Participantes ainda não conferidos'}
            ${g.participantes_atualizado_em ? ` · atualizado em ${fmtData(g.participantes_atualizado_em)}` : ''}
          </div>
        </div>
        <div style="text-align:right">
          ${badge(g.status)}
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            <button class="small secondary" data-atualizar-participantes="${g.id}" data-trilha="${trilha}">Atualizar participantes</button>
            ${g.status !== 'Ativo' ? `<button class="small secondary" data-mudar-status="${g.id}" data-novo-status="Ativo" data-trilha="${trilha}">Marcar Ativo</button>` : ''}
            ${g.status !== 'Pendente' ? `<button class="small secondary" data-mudar-status="${g.id}" data-novo-status="Pendente" data-trilha="${trilha}">Marcar Pendente</button>` : ''}
            ${g.status !== 'Inativo' ? `<button class="small secondary" data-mudar-status="${g.id}" data-novo-status="Inativo" data-trilha="${trilha}">Marcar Inativo</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderFormAdicionarGrupo(trilha) {
  return `
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px">Cadastrar grupo manualmente</div>
      <div class="muted" style="margin-bottom:10px">Use isto quando um grupo foi criado direto no WhatsApp (fora do fluxo "Criar o Grupo") e precisa entrar no sistema pra receber os disparos.</div>
      <form id="form-add-grupo" data-trilha="${trilha}">
        <div>
          <label>ID do grupo (ex: 120363xxxxxxxxxxxx@g.us)</label>
          <input type="text" id="ag-id" required />
        </div>
        <div>
          <label>Nome (opcional)</label>
          <input type="text" id="ag-nome" />
        </div>
        <div>
          <label>Link de convite (opcional)</label>
          <input type="text" id="ag-link" />
        </div>
        <div>
          <label>Status</label>
          <select id="ag-status" style="background:#0e1117;border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;width:100%">
            <option value="Ativo">Ativo — entra nos disparos agora</option>
            <option value="Pendente">Pendente — aguarda o grupo Ativo atual encerrar</option>
            <option value="Inativo">Inativo — só histórico</option>
          </select>
        </div>
        <div><button type="submit">Cadastrar</button></div>
      </form>
      <div id="add-grupo-msg" class="muted" style="margin-top:8px"></div>
    </div>
  `;
}

function renderTrilhaToggle(stateKey) {
  const atual = state[stateKey];
  return `
    <div class="trilha-toggle">
      <button type="button" class="${atual === 'gravado' ? 'active' : ''}" data-set-trilha="${stateKey}" data-trilha-valor="gravado">⚪ Gravado</button>
      <button type="button" class="${atual === 'ao-vivo' ? 'active' : ''}" data-set-trilha="${stateKey}" data-trilha-valor="ao-vivo">🔴 Ao Vivo</button>
    </div>
  `;
}

function renderGrupos() {
  const trilha = state.trilhaGrupos;
  const lista = trilha === 'ao-vivo' ? state.gruposAoVivo : state.grupos;
  const ativos = lista.filter(g => g.status === 'Ativo');
  const pendentes = lista.filter(g => g.status === 'Pendente');
  const inativos = lista.filter(g => g.status === 'Inativo');
  return `
    <div class="page-header">
      <div><h1 class="page-title">Grupos</h1><div class="page-sub">Grupos criados por este sistema — ativos, pendentes e histórico</div></div>
    </div>
    ${renderTrilhaToggle('trilhaGrupos')}
    ${renderFormAdicionarGrupo(trilha)}
    ${lista.length === 0 ? '<div class="empty">Nenhum grupo criado ainda.</div>' : `
      <div class="dia-header">Ativos (${ativos.length})</div>
      ${ativos.length === 0 ? '<div class="empty">Nenhum grupo ativo no momento.</div>' : ativos.map(g => renderCardGrupo(g, trilha)).join('')}
      <div class="dia-header">Pendentes (${pendentes.length})</div>
      ${pendentes.length === 0 ? '<div class="empty">Nenhum grupo pendente.</div>' : `
        <div class="muted" style="margin-bottom:8px">Já criados de verdade (link pronto pra usar), mas ainda fora dos disparos automáticos — ativam sozinhos quando o grupo Ativo atual for encerrado.</div>
        ${pendentes.map(g => renderCardGrupo(g, trilha)).join('')}
      `}
      <div class="dia-header">Inativos / encerrados (${inativos.length})</div>
      ${inativos.length === 0 ? '<div class="empty">Nenhum grupo inativo ainda.</div>' : inativos.map(g => renderCardGrupo(g, trilha)).join('')}
    `}
  `;
}

function renderEditar() {
  const trilha = state.trilhaEditar;
  const m = trilha === 'ao-vivo' ? state.modeloAoVivo : state.modelo;
  return `
    <div class="page-header">
      <div><h1 class="page-title">Editar molde do grupo</h1><div class="page-sub">Nome, imagem e descrição reaproveitados toda semana pelo fluxo "Criar o Grupo"</div></div>
    </div>
    ${renderTrilhaToggle('trilhaEditar')}
    <div class="card">
      <form id="form-modelo" data-trilha="${trilha}">
        <div>
          <label>Nome do grupo</label>
          <input type="text" id="f-nome" required value="${m?.nome ?? ''}" />
        </div>
        <div>
          <label>Descrição</label>
          <textarea id="f-descricao" rows="3">${m?.descricao ?? ''}</textarea>
        </div>
        <div>
          <label>URL da imagem (Google Drive)</label>
          <input type="text" id="f-imagem" value="${m?.imagem_url ?? ''}" />
        </div>
        <div>
          <label>Áudio Nina (Google Drive)</label>
          <input type="text" id="f-audio" value="${m?.audio_url ?? ''}" />
        </div>
        <div><button type="submit">Salvar</button></div>
      </form>
      <div class="muted" style="margin-top:12px">
        ${m?.ultimo_group_id ? `Último grupo criado: ${m.ultimo_group_id}${m.ultimo_invite_url ? ` · <a href="${m.ultimo_invite_url}" target="_blank">${m.ultimo_invite_url}</a>` : ''}` : 'Nenhum grupo criado a partir deste molde ainda.'}
      </div>
      <div id="salvo-msg" class="muted" style="margin-top:8px"></div>
    </div>
  `;
}

function renderUsuarios() {
  return `
    <div class="page-header">
      <div><h1 class="page-title">Usuários</h1><div class="page-sub">Acesso ao sistema</div></div>
    </div>
    <div class="card">
      <div class="muted">Usuário logado</div>
      <div style="font-weight:600;margin-top:4px">${state.me || '—'}</div>
    </div>
    <div class="card">
      <div class="muted">Este sistema hoje tem um único usuário administrador (login/senha configurados no servidor). Pra trocar a senha ou adicionar outro usuário, é preciso mexer nas variáveis de ambiente do servidor.</div>
    </div>
  `;
}

function render() {
  document.querySelectorAll('.navitem').forEach(el => el.classList.toggle('active', el.dataset.view === state.view));
  const main = document.getElementById('main');
  if (state.view === 'overview') main.innerHTML = renderOverview();
  else if (state.view === 'fluxos') main.innerHTML = renderFluxos();
  else if (state.view === 'grupos') main.innerHTML = renderGrupos();
  else if (state.view === 'editar') main.innerHTML = renderEditar();
  else if (state.view === 'config') main.innerHTML = renderConfig();
  else if (state.view === 'usuarios') main.innerHTML = renderUsuarios();
  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll('[data-set-trilha]').forEach(btn => {
    btn.addEventListener('click', () => {
      state[btn.dataset.setTrilha] = btn.dataset.trilhaValor;
      render();
    });
  });

  document.querySelectorAll('[data-executar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const chave = btn.dataset.executar;
      if (!confirm(`Isso vai executar "${chave}" de verdade agora. Confirma?`)) return;
      btn.disabled = true;
      const resultadoEl = document.getElementById(`resultado-${chave}`);
      resultadoEl.innerHTML = '<div class="muted">Executando…</div>';
      try {
        const r = await api(`/api/fluxos/${chave}/executar`, { method: 'POST' });
        resultadoEl.innerHTML = `<div style="color:var(--ok);font-weight:600;margin-bottom:6px">Executado com sucesso ✓</div><pre>${JSON.stringify(r, null, 2)}</pre>`;
        await carregarTudo();
      } catch (e) {
        resultadoEl.innerHTML = `<div style="color:var(--err);font-weight:600">Erro: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-toggle-ativo]').forEach(input => {
    input.addEventListener('change', async () => {
      const chave = input.dataset.toggleAtivo;
      const ativo = input.checked;
      input.disabled = true;
      try {
        await api(`/api/fluxos/${chave}/ativo`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ativo }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro ao atualizar: ${e.message}`);
        input.checked = !ativo;
        input.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-atualizar-participantes]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.atualizarParticipantes;
      const { grupos } = endpointsTrilha(btn.dataset.trilha);
      btn.disabled = true;
      btn.textContent = 'Consultando…';
      try {
        await api(`${grupos}/${encodeURIComponent(id)}/atualizar-participantes`, { method: 'POST' });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro ao atualizar participantes: ${e.message}`);
        btn.disabled = false;
        btn.textContent = 'Atualizar participantes';
      }
    });
  });

  document.querySelectorAll('[data-mudar-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.mudarStatus;
      const status = btn.dataset.novoStatus;
      const { grupos } = endpointsTrilha(btn.dataset.trilha);
      if (!confirm(`Marcar este grupo como "${status}"?`)) return;
      btn.disabled = true;
      try {
        await api(`${grupos}/${encodeURIComponent(id)}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        alert(`Erro: ${e.message}`);
        btn.disabled = false;
      }
    });
  });

  const formAddGrupo = document.getElementById('form-add-grupo');
  if (formAddGrupo) {
    formAddGrupo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { grupos } = endpointsTrilha(formAddGrupo.dataset.trilha);
      const groupId = document.getElementById('ag-id').value.trim();
      const nome = document.getElementById('ag-nome').value.trim();
      const link = document.getElementById('ag-link').value.trim();
      const status = document.getElementById('ag-status').value;
      try {
        await api(grupos, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groupId, nome, link, status }),
        });
        await carregarTudo();
        render();
      } catch (e) {
        document.getElementById('add-grupo-msg').textContent = `Erro: ${e.message}`;
      }
    });
  }

  const formModelo = document.getElementById('form-modelo');
  if (formModelo) {
    formModelo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { modelo } = endpointsTrilha(formModelo.dataset.trilha);
      const nome = document.getElementById('f-nome').value.trim();
      const descricao = document.getElementById('f-descricao').value.trim();
      const imagemUrl = document.getElementById('f-imagem').value.trim();
      const audioEl = document.getElementById('f-audio');
      const body = { nome, descricao, imagemUrl };
      if (audioEl) body.audioUrl = audioEl.value.trim();
      await api(modelo, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      await carregarTudo();
      document.getElementById('salvo-msg').textContent = 'Salvo ✓';
    });
  }

  document.querySelectorAll('[data-editar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const chave = btn.dataset.editar;
      const { campos, cron } = await api(`/api/fluxos/${chave}/editar`);
      state.editando = chave;
      state.editandoCampos = campos;
      state.editandoCron = cron;
      render();
    });
  });

  const btnCancelarEdicaoFluxo = document.getElementById('btn-cancelar-edicao-fluxo');
  if (btnCancelarEdicaoFluxo) {
    btnCancelarEdicaoFluxo.addEventListener('click', () => {
      state.editando = null;
      render();
    });
  }

  const formEditarFluxo = document.getElementById('form-editar-fluxo');
  if (formEditarFluxo) {
    formEditarFluxo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const chave = formEditarFluxo.dataset.chave;
      const campos = {};
      formEditarFluxo.querySelectorAll('[data-campo]').forEach(el => {
        campos[el.dataset.campo] = el.dataset.tipo === 'lista'
          ? el.value.split('\n').map(s => s.trim()).filter(Boolean)
          : el.value;
      });
      const cron = document.getElementById('f-cron').value.trim();
      await api(`/api/fluxos/${chave}/editar`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ campos, cron }),
      });
      state.editando = null;
      await carregarTudo();
      render();
    });
  }

  const formLinkLive = document.getElementById('form-link-live');
  if (formLinkLive) {
    formLinkLive.addEventListener('submit', async (e) => {
      e.preventDefault();
      const link = document.getElementById('f-link-live').value.trim();
      await api('/api/config/link-da-live', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
      });
      state.linkDaLive = link;
      document.getElementById('link-salvo-msg').textContent = 'Salvo ✓';
    });
  }

  const formLinkReplay = document.getElementById('form-link-replay');
  if (formLinkReplay) {
    formLinkReplay.addEventListener('submit', async (e) => {
      e.preventDefault();
      const link = document.getElementById('f-link-replay').value.trim();
      await api('/api/config/link-replay', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
      });
      state.linkReplay = link;
      document.getElementById('replay-salvo-msg').textContent = 'Salvo ✓';
    });
  }

  const formLinkAoVivo = document.getElementById('form-link-ao-vivo');
  if (formLinkAoVivo) {
    formLinkAoVivo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const link = document.getElementById('f-link-ao-vivo').value.trim();
      await api('/api/config/link-ao-vivo', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link }),
      });
      state.linkAoVivo = link;
      document.getElementById('link-ao-vivo-salvo-msg').textContent = 'Salvo ✓';
    });
  }
}

document.querySelectorAll('.navitem').forEach(el => {
  el.addEventListener('click', () => { state.view = el.dataset.view; render(); });
});

document.getElementById('btn-sair').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

(async function init() {
  try {
    await carregarTudo();
  } catch (e) {
    // se não autenticado, api() já redireciona
  }
  render();
  checarStatus();
  setInterval(checarStatus, 15000);
})();
</script>
</body>
</html>
